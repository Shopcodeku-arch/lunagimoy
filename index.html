  <body class="bg-[#131314] text-[#e3e3e3] antialiased h-full w-full overflow-hidden selection:bg-amber-400/30 selection:text-amber-100 overscroll-none">
    <!-- Global Synchronized SVG Mask for Luna Orb -->
    <svg width="0" height="0" style="position: absolute; width: 0; height: 0; pointer-events: none; overflow: hidden;" aria-hidden="true">
      <defs>
        <mask id="luna-orb-shared-mask" maskUnits="userSpaceOnUse" x="-30" y="-30" width="160" height="160">
          <polygon points="35,15 85,35 65,85 15,65" fill="#fff" />
          <polygon points="50,10 90,50 50,90 10,50" fill="#fff" />
          <polygon points="40,20 80,30 70,80 20,60" fill="#fff" />
          <polygon points="25,25 75,25 75,75 25,75" fill="#fff" />
          <polygon points="30,10 80,40 60,90 10,60" fill="#fff" />
          <polygon points="45,15 85,55 55,85 15,45" fill="#fff" />
          <polygon points="50,15 85,45 70,85 30,85 15,45" fill="#fff" />
        </mask>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
